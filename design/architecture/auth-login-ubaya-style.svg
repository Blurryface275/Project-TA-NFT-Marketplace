    <linearGradient id="g-db" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7DD3FC"/><stop offset="50%" stop-color="#0284C7"/><stop offset="100%" stop-color="#075985"/></linearGradient>
    <linearGradient id="g-jwt" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#DDD6FE"/><stop offset="100%" stop-color="#5B21B6"/></linearGradient>
    <linearGradient id="g-mw" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6EE7B7"/><stop offset="100%" stop-color="#047857"/></linearGradient>
