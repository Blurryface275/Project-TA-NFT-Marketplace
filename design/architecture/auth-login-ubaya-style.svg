<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1480" width="1900" height="1480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Gambar 4.2 Rancangan Arsitektur Login, Session JWT, dan Proteksi Middleware (Detail Lengkap)</title>
  <desc>Diagram arsitektur 5 kolom dengan 4 pengecekan auth.service.ts, JOIN users+customers+organizers, User DTO utuh, JWT HS256 HttpOnly cookie, dan middleware</desc>

