  <path d="M 760 645 C 720 645, 695 660, 650 660" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>

  <!-- Step 7: Create Session -->
  <svg x="518" y="620" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke="#000" stroke-linejoin="round" stroke-width="4"><path fill="#2F88FF" d="M22.8682 24.2982C25.4105 26.7935 26.4138 30.4526 25.4971 33.8863C24.5805 37.32 21.8844 40.0019 18.4325 40.9137C14.9806 41.8256 11.3022 40.8276 8.79375 38.2986C5.02208 34.4141 5.07602 28.2394 8.91499 24.4206C12.754 20.6019 18.9613 20.5482 22.8664 24.3L22.8682 24.2982Z" /><path stroke-linecap="round" d="M23 24L40 7" /><path fill="#2F88FF" d="M30.3052 16.9001L35.7337 22.3001L42.0671 16.0001L36.6385 10.6001L30.3052 16.9001Z" /></g></svg>
  <text x="550" y="698" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">7. createSession() (session.ts:22-89)</text>
  <text x="550" y="716" font-size="11" fill="#4B5563" text-anchor="middle">Library: jose (SignJWT HS256 + SESSION_SECRET, 7d)</text>
  <g font-family="monospace" font-size="10" fill="#5B21B6">
    <text x="390" y="738">{ "userId": "1", "name": "Alice",</text>
    <text x="400" y="753">"walletAddress": "", "email": "alice@gmail.com",</text>
    <text x="400" y="768">"role": "CUSTOMER", "organizersId": null }</text>
  </g>

  <!-- Step 8: HttpOnly Cookie & Redirect -->
  <path d="M 390 735 C 330 735, 290 735, 230 735" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <text x="190" y="710" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">8. Simpan Cookie "session"</text>
  <text x="190" y="728" font-family="monospace" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">httpOnly: true, maxAge: 604800s (7 hari)</text>
  <text x="190" y="746" font-family="monospace" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">redirect("/dashboard") (actions.ts:93)</text>

  <!-- Step 9: Middleware -->
  <path d="M 190 770 C 190 910, 290 945, 420 945" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <svg x="518" y="890" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke-linejoin="round" stroke-width="4"><path fill="#2F88FF" stroke="#000" d="M6 9.25564L24.0086 4L42 9.25564V20.0337C42 31.3622 34.7502 41.4194 24.0026 45.0005C13.2521 41.4195 6 31.36 6 20.0287V9.25564Z" /><path stroke="#fff" stroke-linecap="round" d="M15 23L22 30L34 18" /></g></svg>
  <text x="550" y="972" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">9. Evaluasi Middleware (middleware.ts:8 • jwt.ts:6)</text>
  <g font-family="monospace" font-size="10.5" fill="#047857">
    <text x="395" y="996">jwtVerify(cookie, encodedKey, { algorithms: ["HS256"] })</text>
    <text x="395" y="1014">• /dashboard/* (non-/buy): wajib session?.userId</text>
    <text x="395" y="1032">• /dashboard/admin/*: wajib role === "ORGANIZER"</text>
  </g>

  <text x="950" y="1435" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Gambar 4.2 Rancangan Arsitektur Login, Session JWT, dan Proteksi Middleware</text>
