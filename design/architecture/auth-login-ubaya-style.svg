  <text x="1310" y="269" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">1) Apakah user ditemukan? (#L134) → else 401</text>

  <path d="M 1310 284 L 1310 304" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="308" width="320" height="38" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="331" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">2) Apakah password cocok? (bcrypt.compare #L139)</text>

  <path d="M 1310 346 L 1310 366" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="370" width="320" height="38" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="393" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">3) Apakah isEmailVerified === true? (#L147)</text>

  <path d="M 1310 408 L 1310 428" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="432" width="320" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="1310" y="453" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">4) Apakah users_id ada di organizers? (#L152)</text>
  <text x="1310" y="472" font-family="monospace" font-size="10.5" fill="#9A3412" text-anchor="middle">Ya: "ORGANIZER" • Tidak: "CUSTOMER"</text>

  <path d="M 1310 484 L 1310 504" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="508" width="320" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1310" y="527" font-family="monospace" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle">const { password, ...result } = user; (#L159)</text>
  <text x="1310" y="543" font-size="10" fill="#047857" text-anchor="middle">Buang hash password + tempel walletAddress &amp; role</text>

  <!-- Step 5: MySQL Tables (users JOIN customers + organizers) -->
  <path d="M 1465 265 L 1575 265" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <svg x="1668" y="130" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"><path d="M44 31C44 36.5228 39.5228 41 34 41C32.2091 41 30.5281 40.5292 29.0741 39.7046C26.5143 38.2529 24.6579 35.7046 24.1436 32.6983C24.0492 32.1463 24 31.5789 24 31C24 28.4323 24.9678 26.0906 26.5585 24.3198C28.3892 22.2818 31.0449 21 34 21C39.5228 21 44 25.4772 44 31Z" /><path d="M34 12V20V21C31.0449 21 28.3892 22.2818 26.5585 24.3198C24.9678 26.0906 24 28.4323 24 31C24 31.5789 24.0492 32.1463 24.1436 32.6983C24.6579 35.7046 26.5143 38.2529 29.0741 39.7046C26.4116 40.5096 22.8776 41 19 41C10.7157 41 4 38.7614 4 36V28V20V12" /><path fill="#2F88FF" d="M34 12C34 14.7614 27.2843 17 19 17C10.7157 17 4 14.7614 4 12C4 9.23858 10.7157 7 19 7C27.2843 7 34 9.23858 34 12Z" /><path d="M4 28C4 30.7614 10.7157 33 19 33C20.807 33 22.5393 32.8935 24.1436 32.6983" /><path d="M4 20C4 22.7614 10.7157 25 19 25C21.7563 25 24.339 24.7522 26.5585 24.3198" /><path d="M34 41C34 41 30.5 35.1375 30.5 31C30.5 26.8625 34 21 34 21" /><path d="M34 41C34 41 37.5 35.1375 37.5 31C37.5 26.8625 34 21 34 21" /><path d="M44 31H24" /></g></svg>
  <text x="1700" y="210" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">5. Query MySQL (users JOIN customers)</text>
  <g font-family="monospace" font-size="10" fill="#0369A1">
    <text x="1520" y="236">Tabel users (9 kolom, #L128):</text>
    <text x="1520" y="251">{ "id": 1, "name": "Alice",</text>
    <text x="1530" y="266">"email": "alice@gmail.com",</text>
    <text x="1530" y="281">"password": "$2b$10$N9qo8u...",</text>
    <text x="1530" y="296">"isEmailVerified": true,</text>
    <text x="1530" y="311">"emailVerificationToken": null,</text>
    <text x="1530" y="326">"emailVerificationExpires": null }</text>
    <text x="1520" y="348">JOIN customers (relations #L130):</text>
    <text x="1520" y="363">{ "id": 1, "walletAddress": null,</text>
    <text x="1530" y="378">"nikHash": "0x2864b40e...", "usersId": 1 }</text>
    <text x="1520" y="400">Query organizers (#L152):</text>
    <text x="1520" y="415">[] → role = "CUSTOMER"</text>
  </g>

  <!-- Step 6: Return User DTO -->
  <path d="M 1150 530 C 1090 595, 1080 610, 1055 610" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <text x="930" y="575" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">6. HTTP 201 OK (User DTO)</text>
  <g font-family="monospace" font-size="10" fill="#059669">
    <text x="760" y="596">{</text>
    <text x="775" y="611">"id": 1, "name": "Alice",</text>
    <text x="775" y="626">"email": "alice@gmail.com",</text>
    <text x="775" y="641">"isEmailVerified": true,</text>
