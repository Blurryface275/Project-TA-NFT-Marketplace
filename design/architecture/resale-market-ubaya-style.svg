<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1440" width="1900" height="1440" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Gambar 4.6 Rancangan Arsitektur Pasar Sekunder Resmi (Detail Lengkap)</title>
  <desc>Diagram arsitektur 5 kolom gaya seragam dengan kotak keputusan eksplisit, Price-Lock, Anti-Race Lock, dan Allowlist Transfer _update()</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#111827"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/></marker>
    <filter id="yed-shadow" x="-15%" y="-15%" width="135%" height="135%"><feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/></filter>
    <radialGradient id="g-skin" cx="35%" cy="30%" r="65%"><stop offset="0%" stop-color="#FFE0BD"/><stop offset="100%" stop-color="#E5A97C"/></radialGradient>
    <linearGradient id="g-shirt" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#1E3A8A"/></linearGradient>
    <linearGradient id="g-lock" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FDBA74"/><stop offset="100%" stop-color="#9A3412"/></linearGradient>
    <linearGradient id="g-eth" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#A5B4FC"/><stop offset="100%" stop-color="#3730A3"/></linearGradient>
    <linearGradient id="g-pay" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6EE7B7"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  </defs>

  <rect width="1900" height="1440" fill="#FFFFFF"/>
  <line x1="360" y1="60" x2="360" y2="1340" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="740" y1="60" x2="740" y2="1340" stroke="#111827" stroke-width="2"/>
  <line x1="1120" y1="60" x2="1120" y2="1340" stroke="#111827" stroke-width="2"/>
  <line x1="1500" y1="60" x2="1500" y2="1340" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="190" y="92" font-size="15" font-weight="800" fill="#1E3A8A" text-anchor="middle">1. PENJUAL (ALICE)</text>
  <text x="550" y="92" font-size="15" font-weight="800" fill="#1E3A8A" text-anchor="middle">2. PEMBELI (BOB) &amp; UI</text>
  <text x="930" y="92" font-family="'Times New Roman', Georgia, serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle">3. PUBLIC CHANNEL (RESALE API)</text>
  <text x="1310" y="92" font-size="15" font-weight="800" fill="#9F1239" text-anchor="middle">4. RESALE SERVICE (NestJS)</text>
  <text x="1700" y="92" font-size="15" font-weight="800" fill="#0369A1" text-anchor="middle">5. MARKETPLACE CONTRACT &amp; DB</text>

  <!-- Step 1 -->
  <svg x="158" y="130" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"><circle cx="24" cy="12" r="8" fill="#2F88FF" /><path d="M42 44C42 34.0589 33.9411 26 24 26C14.0589 26 6 34.0589 6 44" /></g></svg>
  <text x="190" y="210" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">1. Alice jual Tiket #42 (TicketCard:611)</text>
  <g font-family="monospace" font-size="10.2" fill="#1D4ED8">
    <text x="55" y="236">{</text>
    <text x="70" y="251">"tokenId": 42,</text>
    <text x="70" y="266">"sellerWallet": "0x71C676d63428..."</text>
    <text x="55" y="281">}</text>
  </g>

  <path d="M 320 250 L 815 250" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="930" y="215" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">2. POST /api/tickets/resale/list</text>
  <g font-family="monospace" font-size="10" fill="#111827">
    <text x="770" y="238">{ "tokenId": 42, "sellerWallet": "0x71C6..." }</text>
  </g>
  <path d="M 1055 250 L 1150 250" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Step 3 Backend Decision Boxes -->
  <text x="1310" y="150" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">3. listTicketForResale() (#L1245-1310)</text>
  <rect x="1150" y="168" width="320" height="36" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="190" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">1) Apakah onChainTicket.owner == seller? (#L1250)</text>

  <path d="M 1310 204 L 1310 222" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="226" width="320" height="36" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="248" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">2) Apakah !onChainTicket.used? (#L1255) → else 400</text>

  <path d="M 1310 262 L 1310 280" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="284" width="320" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1310" y="308" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">3) writeContract('listTicket') [viem] + Save ACTIVE</text>

  <path d="M 1470 304 L 1575 304" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>

  <svg x="1668" y="130" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke-linejoin="round" stroke-width="4"><rect width="36" height="22" x="6" y="22" fill="#2F88FF" stroke="#000" rx="2" /><path stroke="#000" stroke-linecap="round" d="M14 22V14C14 8.47715 18.4772 4 24 4C29.5228 4 34 8.47715 34 14V22" /><path stroke="#fff" stroke-linecap="round" d="M24 30V36" /></g></svg>
  <text x="1700" y="210" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">4. Price-Lock &amp; resale_listings</text>
  <g font-family="monospace" font-size="10" fill="#0369A1">
    <text x="1525" y="236">{</text>
    <text x="1540" y="251">"id": "9b1deb4d-3b7d-4bad-9bdd...",</text>
    <text x="1540" y="266">"sellerWallet": "0x71C676d63428...",</text>
    <text x="1540" y="281">"lockedPrice": 750000,</text>
    <text x="1540" y="296">"status": "ACTIVE", "ticketCacheTokenId": 42</text>
    <text x="1525" y="311">}</text>
  </g>

  <!-- Step 5 Bob Checkout & Anti-Race Lock -->
  <svg x="518" y="430" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke-linecap="round" stroke-width="4"><path stroke="#000" stroke-linejoin="round" d="M9.00013 16.0001L34 6.00008L38.0004 16.0001" /><path fill="#2F88FF" stroke="#000" stroke-linejoin="round" d="M4 16H44V22C41 22 38 24 38 27.5C38 31 41 34 44 34V40H4V34C7.00016 34 10 32 10 28C10 24 7 22 4 22V16Z" /><path stroke="#fff" d="M17 25.3848H23" /><path stroke="#fff" d="M17 31.3848H31" /></g></svg>
  <text x="550" y="505" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">5. Bob Checkout (ResaleDetailClient:59)</text>
  <path d="M 695 510 L 1150 510" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="930" y="485" font-size="12.5" font-weight="800" fill="#111827" text-anchor="middle">6. createResaleSnapTransaction() (#L1397)</text>

  <!-- Backend Decision Boxes for Resale Checkout -->
  <rect x="1150" y="490" width="320" height="38" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="513" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">4) Apakah status == ACTIVE? → Lock LOCKED (15m)</text>

  <path d="M 1310 528 L 1310 548" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="552" width="320" height="38" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1310" y="575" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">5) Webhook Settlement → handleResaleNotification()</text>

  <path d="M 1470 570 L 1575 570" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <svg x="1668" y="460" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"><path d="M40 30V15L27.5 7.96875M20.5 7.96875L8 15V30M11 34.6875L24 42L32 37.5L37 34.6875" /><path fill="#2F88FF" d="M21 18.75L18 20.5V24V27.5L21 29.25L24 31L27 29.25L30 27.5V24V20.5L27 18.75L24 17L21 18.75Z" /><path d="M24 17V10" /><path d="M30 27L37 31" /><path d="M18 27L11 31" /><circle cx="24" cy="7" r="3" fill="#2F88FF" /><circle cx="8" cy="33" r="3" fill="#2F88FF" /><circle cx="40" cy="33" r="3" fill="#2F88FF" /></g></svg>
  <text x="1700" y="540" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">7. executeResale(42, Bob) &amp; _update()</text>
  <g font-family="monospace" font-size="10" fill="#059669">
    <text x="1525" y="564">• TicketContract._update(): msg.sender == marketplace</text>
    <text x="1525" y="580">• UPDATE ticket_cache.ownerWallet = "0xBob..."</text>
    <text x="1525" y="596">• UPDATE resale_listings.status = "SOLD"</text>
  </g>

  <path d="M 1520 675 C 1220 735, 820 735, 650 735" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <text x="930" y="720" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">8. NFT #42 Berpindah ke Bob (Zero-Profit Resale)</text>

  <text x="950" y="1395" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Gambar 4.6 Rancangan Arsitektur Pasar Sekunder Resmi (Resale Market)</text>
</svg>
