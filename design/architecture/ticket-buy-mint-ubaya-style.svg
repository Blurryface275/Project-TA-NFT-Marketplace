<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1560" width="1900" height="1560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Gambar 4.4 Rancangan Arsitektur Pembelian Tiket, EIP-712, dan Minting NFT (Detail Lengkap)</title>
  <desc>Diagram arsitektur 5 kolom gaya seragam dengan kotak keputusan eksplisit, EIP-712 MintAuth, ECDSA.recover, dan JSON utuh</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#111827"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/></marker>
    <filter id="yed-shadow" x="-15%" y="-15%" width="135%" height="135%"><feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/></filter>
    <linearGradient id="g-cf" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FDBA74"/><stop offset="100%" stop-color="#C2410C"/></linearGradient>
    <linearGradient id="g-pay" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6EE7B7"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="g-eip" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#DDD6FE"/><stop offset="100%" stop-color="#4C1D95"/></linearGradient>
    <linearGradient id="g-eth" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#A5B4FC"/><stop offset="100%" stop-color="#3730A3"/></linearGradient>
    <linearGradient id="g-db" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7DD3FC"/><stop offset="50%" stop-color="#0284C7"/><stop offset="100%" stop-color="#075985"/></linearGradient>
  </defs>

  <rect width="1900" height="1560" fill="#FFFFFF"/>
  <line x1="360" y1="60" x2="360" y2="1470" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="740" y1="60" x2="740" y2="1470" stroke="#111827" stroke-width="2"/>
  <line x1="1120" y1="60" x2="1120" y2="1470" stroke="#111827" stroke-width="2"/>
  <line x1="1500" y1="60" x2="1500" y2="1470" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="190" y="92" font-size="15" font-weight="800" fill="#1E3A8A" text-anchor="middle">1. ALICE / FRONTEND UI</text>
  <text x="550" y="92" font-size="15" font-weight="800" fill="#1E3A8A" text-anchor="middle">2. BUY ACTION &amp; SNAP POPUP</text>
  <text x="930" y="92" font-family="'Times New Roman', Georgia, serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle">3. PUBLIC CHANNEL (HTTP/WEBHOOK)</text>
  <text x="1310" y="92" font-size="15" font-weight="800" fill="#9F1239" text-anchor="middle">4. TICKETS SERVICE &amp; EIP-712</text>
  <text x="1700" y="92" font-size="15" font-weight="800" fill="#0369A1" text-anchor="middle">5. SEPOLIA EVM &amp; MYSQL</text>

  <!-- Step 1 -->
  <svg x="158" y="130" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><path fill="#2F88FF" stroke="#000" stroke-linejoin="round" stroke-width="4" d="M6 8.25564L24.0086 3L42 8.25564V19.0337C42 30.3622 34.7502 40.4194 24.0026 44.0005C13.2521 40.4195 6 30.36 6 19.0287V8.25564Z" /></svg>
  <text x="190" y="210" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">1. Alice pilih tiket &amp; Turnstile</text>
  <text x="190" y="228" font-size="11" fill="#4B5563" text-anchor="middle">BuyTicketCard.tsx:114-146</text>
  <g font-family="monospace" font-size="10.2" fill="#1D4ED8">
    <text x="65" y="252">{</text>
    <text x="80" y="267">"eventId": 1, "categoryId": 2,</text>
    <text x="80" y="282">"quantity": 1,</text>
    <text x="80" y="297">"walletAddress": "0x71C676d63428...",</text>
    <text x="80" y="312">"turnstileToken": "0.9xA8kL..."</text>
    <text x="65" y="327">}</text>
  </g>

  <path d="M 320 265 L 420 265" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="550" y="250" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">2. buy/actions.ts:88</text>
  <text x="550" y="270" font-family="monospace" font-size="10.5" fill="#1D4ED8" text-anchor="middle">fetch POST /tickets/create-snap</text>

  <path d="M 695 265 L 815 265" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="930" y="215" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">3. HTTP POST Create Snap</text>
  <g font-family="monospace" font-size="10" fill="#111827">
    <text x="765" y="238" fill="#1D4ED8">POST /api/tickets/create-snap</text>
    <text x="765" y="256">{ "eventId": 1, "categoryId": 2,</text>
    <text x="775" y="271">"quantity": 1, "turnstileToken": "..." }</text>
  </g>
  <path d="M 1055 265 L 1175 265" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Step 4 Backend Decision Boxes -->
  <text x="1310" y="150" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">4. createSnapTransaction() (#L591-761)</text>
  <rect x="1150" y="168" width="320" height="38" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="191" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">1) Apakah Turnstile /siteverify lolos? (#L599) → else 400</text>

  <path d="M 1310 206 L 1310 226" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="230" width="320" height="38" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="253" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">2) Apakah Flash Sale dibuka &amp; kuota cukup? (#L621)</text>

  <path d="M 1310 268 L 1310 288" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="292" width="320" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1310" y="311" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">3) Request Snap Token Midtrans (#L716)</text>
  <text x="1310" y="327" font-family="monospace" font-size="10" fill="#047857" text-anchor="middle">gross_amount: Rp 158.750 → snapToken="66e4..."</text>

  <!-- Return Snap Token -->
  <path d="M 1150 325 C 1020 390, 820 390, 665 390" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <text x="930" y="376" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">5. Return { "orderId": "ORD-1731778-1", "snapToken": "66e4..." }</text>
  <text x="550" y="420" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">6. Alice bayar via Midtrans Snap Popup</text>
  <text x="550" y="440" font-family="monospace" font-size="10.5" fill="#059669" text-anchor="middle">QRIS / VA Lunas → Status "settlement"</text>

  <!-- Step 7 Webhook -->
  <path d="M 695 495 L 815 495" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="930" y="468" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">7. Midtrans Webhook (#L1103)</text>
  <g font-family="monospace" font-size="10" fill="#111827">
    <text x="760" y="490" fill="#1D4ED8">POST /api/tickets/midtrans-notification</text>
    <text x="760" y="508">{</text>
    <text x="775" y="523">"order_id": "ORD-1731778-1",</text>
    <text x="775" y="538">"transaction_status": "settlement",</text>
    <text x="775" y="553">"gross_amount": "158750.00",</text>
    <text x="775" y="568">"signature_key": "8f1a9c...sha512"</text>
    <text x="760" y="583">}</text>
  </g>
  <path d="M 1055 530 L 1175 530" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Step 8 EIP-712 Decision & Signing -->
  <rect x="1150" y="505" width="320" height="38" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="528" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">4) Apakah SHA-512 signature_key valid? → else 403</text>

  <path d="M 1310 543 L 1310 568" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <svg x="1278" y="575" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke="#000" stroke-linejoin="round" stroke-width="4"><path fill="#2F88FF" d="M22.8682 24.2982C25.4105 26.7935 26.4138 30.4526 25.4971 33.8863C24.5805 37.32 21.8844 40.0019 18.4325 40.9137C14.9806 41.8256 11.3022 40.8276 8.79375 38.2986C5.02208 34.4141 5.07602 28.2394 8.91499 24.4206C12.754 20.6019 18.9613 20.5482 22.8664 24.3L22.8682 24.2982Z" /><path stroke-linecap="round" d="M23 24L40 7" /><path fill="#2F88FF" d="M30.3052 16.9001L35.7337 22.3001L42.0671 16.0001L36.6385 10.6001L30.3052 16.9001Z" /></g></svg>
  <text x="1310" y="645" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">8. EIP-712 Signer (viem #L166-200)</text>
  <g font-family="monospace" font-size="10" fill="#5B21B6">
    <text x="1145" y="668">domain: { "name": "NFTix", "version": "1",</text>
    <text x="1155" y="683">"chainId": 11155111, "verifyingContract": "0x..." }</text>
    <text x="1145" y="700">MintAuth: { "to": "0x71C6...", "eventId": 1,</text>
    <text x="1155" y="715">"categoryId": 2, "nonce": "1731778283000000" }</text>
    <text x="1145" y="735" fill="#C2410C">digest = keccak256("\x19\x01"||domainSep||structHash)</text>
  </g>

  <!-- Step 9 Sepolia Decision Boxes & MySQL -->
  <path d="M 1465 660 L 1575 660" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <svg x="1668" y="505" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"><path d="M40 30V15L27.5 7.96875M20.5 7.96875L8 15V30M11 34.6875L24 42L32 37.5L37 34.6875" /><path fill="#2F88FF" d="M21 18.75L18 20.5V24V27.5L21 29.25L24 31L27 29.25L30 27.5V24V20.5L27 18.75L24 17L21 18.75Z" /><path d="M24 17V10" /><path d="M30 27L37 31" /><path d="M18 27L11 31" /><circle cx="24" cy="7" r="3" fill="#2F88FF" /><circle cx="8" cy="33" r="3" fill="#2F88FF" /><circle cx="40" cy="33" r="3" fill="#2F88FF" /></g></svg>
  <text x="1700" y="585" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">9. TicketContract.mintTicket() (#L225-260)</text>

  <rect x="1530" y="602" width="340" height="36" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1700" y="624" font-size="10.5" font-weight="700" fill="#111827" text-anchor="middle">1) Apakah !usedNonces[nonce]? (#L237) → else revert</text>

  <path d="M 1700 638 L 1700 656" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1530" y="660" width="340" height="36" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1700" y="682" font-size="10.5" font-weight="700" fill="#111827" text-anchor="middle">2) ECDSA.recover(digest, sig) == systemSigner? (#L246)</text>

  <path d="M 1700 696 L 1700 714" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1530" y="718" width="340" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1700" y="742" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle">3) Lock nonce &amp; _mint(to, 42) + Sync ticket_cache</text>

  <path d="M 1520 755 C 1220 880, 620 880, 290 880" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <text x="930" y="866" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">10. NFT #42 Tercetak &amp; Tampil di /dashboard/tickets</text>

  <text x="950" y="1520" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Gambar 4.4 Rancangan Arsitektur Pembelian Tiket, EIP-712 Signer, dan Minting NFT</text>
</svg>
