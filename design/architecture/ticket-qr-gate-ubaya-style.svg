<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1380" width="1900" height="1380" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Gambar 4.5 Rancangan Arsitektur Dynamic QR Code dan Verifikasi Dual-Scan Venue Gate (Detail Lengkap)</title>
  <desc>Diagram arsitektur 5 kolom gaya seragam dengan kotak keputusan eksplisit, RAM-only keccak256(NIK), dan markUsed Sepolia</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#111827"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/></marker>
    <filter id="yed-shadow" x="-15%" y="-15%" width="135%" height="135%"><feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/></filter>
    <linearGradient id="g-qr" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E2E8F0"/><stop offset="100%" stop-color="#64748B"/></linearGradient>
    <linearGradient id="g-bio" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FDBA74"/><stop offset="100%" stop-color="#9A3412"/></linearGradient>
    <linearGradient id="g-gear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FB7185"/><stop offset="100%" stop-color="#9F1239"/></linearGradient>
    <linearGradient id="g-eth" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#A5B4FC"/><stop offset="100%" stop-color="#3730A3"/></linearGradient>
    <linearGradient id="g-ok" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6EE7B7"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  </defs>

  <rect width="1900" height="1380" fill="#FFFFFF"/>
  <line x1="360" y1="60" x2="360" y2="1280" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="740" y1="60" x2="740" y2="1280" stroke="#111827" stroke-width="2"/>
  <line x1="1120" y1="60" x2="1120" y2="1280" stroke="#111827" stroke-width="2"/>
  <line x1="1500" y1="60" x2="1500" y2="1280" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="190" y="92" font-size="15" font-weight="800" fill="#1E3A8A" text-anchor="middle">1. HP ALICE (DYNAMIC QR)</text>
  <text x="550" y="92" font-size="15" font-weight="800" fill="#1E3A8A" text-anchor="middle">2. KAMERA SCANNER STAF</text>
  <text x="930" y="92" font-family="'Times New Roman', Georgia, serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle">3. PUBLIC CHANNEL (GATE API)</text>
  <text x="1310" y="92" font-size="15" font-weight="800" fill="#9F1239" text-anchor="middle">4. BACKEND GATE VERIFIER</text>
  <text x="1700" y="92" font-size="15" font-weight="800" fill="#0369A1" text-anchor="middle">5. SEPOLIA EVM &amp; MYSQL</text>

  <!-- Step 1 -->
  <svg x="158" y="130" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke="#000" stroke-width="4"><path fill="#2F88FF" stroke-linejoin="round" d="M20 6H6V20H20V6Z" /><path fill="#2F88FF" stroke-linejoin="round" d="M20 28H6V42H20V28Z" /><path fill="#2F88FF" stroke-linejoin="round" d="M42 6H28V20H42V6Z" /><path stroke-linecap="round" d="M29 28V42" /><path stroke-linecap="round" d="M41 28V42" /></g></svg>
  <text x="190" y="210" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">1. Generate Dynamic QR (60s)</text>
  <text x="190" y="228" font-size="11" fill="#4B5563" text-anchor="middle">TicketCard.tsx:150-196 (qrcode.react)</text>
  <g font-family="monospace" font-size="10.2" fill="#1D4ED8">
    <text x="55" y="252">{</text>
    <text x="70" y="267">"tokenId": 42,</text>
    <text x="70" y="282">"walletAddress": "0x71C676d63428...",</text>
    <text x="70" y="297">"nonce": "384912048",</text>
    <text x="70" y="312">"signedAt": "2026-11-17T00:30:10.000Z",</text>
    <text x="70" y="327">"signature": "0x3f9a8c12...P256"</text>
    <text x="55" y="342">}</text>
  </g>

  <path d="M 320 265 L 420 265" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <svg x="518" y="130" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"><path d="M18 43V22C18 18.6863 20.6863 16 24 16C27.3137 16 30 18.6863 30 22V43" /><path d="M12 40V22C12 15.3726 17.3726 10 24 10C30.6274 10 36 15.3726 36 22V40" /><path d="M6 35V22C6 12.0589 14.0589 4 24 4C33.9411 4 42 12.0589 42 22V35" /><path d="M24 44V31" /><path d="M24 24.625V21.875" /></g></svg>
  <text x="550" y="210" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">2. Staf Dual-Scan (VerifyClient.tsx:62)</text>
  <text x="550" y="228" font-size="11" fill="#4B5563" text-anchor="middle">Library: html5-qrcode + Input KTP 16 digit</text>
  <g font-family="monospace" font-size="10.2" fill="#C2410C">
    <text x="395" y="252">Scan 1: QR JSON dari layar HP Alice</text>
    <text x="395" y="270">Scan 2: "nik": "1234567890123456"</text>
  </g>

  <!-- Step 3 -->
  <path d="M 695 265 L 815 265" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="930" y="200" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">3. HTTP POST Dual-Scan</text>
  <g font-family="monospace" font-size="10" fill="#111827">
    <text x="760" y="222" fill="#1D4ED8">POST /api/tickets/verify-dual-scan</text>
    <text x="760" y="240">{</text>
    <text x="775" y="255">"tokenId": 42, "walletAddress": "0x71C6...",</text>
    <text x="775" y="270">"signedAt": "2026-11-17T00:30:10.000Z",</text>
    <text x="775" y="285">"signature": "0x3f9a8c12...",</text>
    <text x="775" y="300">"nik": "1234567890123456"</text>
    <text x="760" y="315">}</text>
  </g>
  <path d="M 1055 265 L 1175 265" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Step 4 Backend Decision Boxes -->
  <svg x="1278" y="130" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none"><path stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M24 40H7C5.34315 40 4 38.6569 4 37V11C4 9.34315 5.34315 8 7 8H41C42.6569 8 44 9.34315 44 11V23.0588" /><path fill="#2F88FF" stroke="#000" stroke-width="4" d="M4 11C4 9.34315 5.34315 8 7 8H41C42.6569 8 44 9.34315 44 11V20H4V11Z" /><circle r="2" fill="#fff" transform="matrix(0 -1 -1 0 10 14)" /><circle r="2" fill="#fff" transform="matrix(0 -1 -1 0 16 14)" /><circle cx="37" cy="34" r="3" stroke="#000" stroke-width="4" /><path stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M37 41V37" /><path stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M37 31V27" /><path stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M30.9378 37.5L34.4019 35.5" /><path stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M39.5979 32.5L43.062 30.5" /><path stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M30.9378 30.5L34.4019 32.5" /><path stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M39.5979 35.5L43.062 37.5" /></g></svg>
  <text x="1310" y="210" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">4. verifyDualScanGate() (#L298-447)</text>

  <rect x="1150" y="232" width="320" height="36" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="254" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">1) Apakah QR signedAt &lt;= 60 detik? (#L311) → else 400</text>

  <path d="M 1310 268 L 1310 286" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="290" width="320" height="36" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="312" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">2) Apakah !cachedTicket.used? (#L327) → else 400</text>

  <path d="M 1310 326 L 1310 344" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="348" width="320" height="36" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="370" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">3) Apakah event milik organizer? (#L337) → else 403</text>

  <path d="M 1310 384 L 1310 402" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1150" y="406" width="320" height="44" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="1310" y="425" font-family="monospace" font-size="10.5" font-weight="700" fill="#9A3412" text-anchor="middle">4) nikHash = keccak256("1234...") [viem]</text>
  <text x="1310" y="441" font-size="10" fill="#C2410C" text-anchor="middle">NIK mentah dibuang dari RAM (UU PDP)</text>

  <!-- Step 5 Sepolia Decision Boxes -->
  <path d="M 1470 428 L 1575 428" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arr)"/>
  <svg x="1668" y="250" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"><path d="M40 30V15L27.5 7.96875M20.5 7.96875L8 15V30M11 34.6875L24 42L32 37.5L37 34.6875" /><path fill="#2F88FF" d="M21 18.75L18 20.5V24V27.5L21 29.25L24 31L27 29.25L30 27.5V24V20.5L27 18.75L24 17L21 18.75Z" /><path d="M24 17V10" /><path d="M30 27L37 31" /><path d="M18 27L11 31" /><circle cx="24" cy="7" r="3" fill="#2F88FF" /><circle cx="8" cy="33" r="3" fill="#2F88FF" /><circle cx="40" cy="33" r="3" fill="#2F88FF" /></g></svg>
  <text x="1700" y="330" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">5. Cek On-Chain &amp; markUsed(42)</text>

  <rect x="1530" y="352" width="340" height="40" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1700" y="376" font-size="10.5" font-weight="700" fill="#111827" text-anchor="middle">1) userIdentities[0x71C6] == nikHash? → else DENIED</text>

  <path d="M 1700 392 L 1700 412" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="1530" y="416" width="340" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1700" y="440" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle">2) Tx: markUsed(42) &amp; UPDATE ticket_cache.used = 1</text>

  <!-- Step 6 Response -->
  <path d="M 1520 510 C 1220 580, 820 580, 650 580" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <g font-family="monospace" font-size="10.2" fill="#059669">
    <text x="770" y="550" font-weight="800">6. HTTP 200 OK (Gate Access Granted):</text>
    <text x="770" y="568">{ "access": "GRANTED", "tokenId": 42, "category": "VIP", "txHash": "0x91ab..." }</text>
  </g>

  <svg x="518" y="620" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 48 48"><g fill="none" stroke-linejoin="round" stroke-width="4"><path fill="#2F88FF" stroke="#000" d="M24 44C29.5228 44 34.5228 41.7614 38.1421 38.1421C41.7614 34.5228 44 29.5228 44 24C44 18.4772 41.7614 13.4772 38.1421 9.85786C34.5228 6.23858 29.5228 4 24 4C18.4772 4 13.4772 6.23858 9.85786 9.85786C6.23858 13.4772 4 18.4772 4 24C4 29.5228 6.23858 34.5228 9.85786 38.1421C13.4772 41.7614 18.4772 44 24 44Z" /><path stroke="#fff" stroke-linecap="round" d="M16 24L22 30L34 18" /></g></svg>
  <text x="550" y="696" font-size="13" font-weight="800" fill="#059669" text-anchor="middle">7. Layar Scanner Hijau → Alice Masuk Venue</text>

  <text x="950" y="1340" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Gambar 4.5 Rancangan Arsitektur Dynamic QR dan Verifikasi Dual-Scan Gate</text>
</svg>
