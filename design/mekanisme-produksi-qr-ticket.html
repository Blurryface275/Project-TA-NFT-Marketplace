<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekanisme Produksi Dynamic QR Ticket WebAuthn</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 24px;
            background-color: #090d16;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            max-width: 1720px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 12px 20px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        #diagram-card {
            background: #0f172a;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #334155;
            overflow: auto;
            max-width: 100%;
        }
        svg {
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="header-title">
            🖼️ Diagram Mekanisme Produksi Dynamic QR Ticket (WebAuthn Passkey ECDSA P-256)
        </div>
        <div class="btn-group">
            <a href="./mekanisme-produksi-qr-ticket.svg" download="mekanisme-produksi-qr-ticket.svg" class="btn">
                ⬇️ Unduh File SVG Asli
            </a>
            <button onclick="window.print()" class="btn btn-secondary">
                🖨️ Cetak / Simpan PDF
            </button>
        </div>
    </div>

    <div id="diagram-card">
        <!-- Embed SVG langsung agar tajam dan skalabel -->
        <object data="./mekanisme-produksi-qr-ticket.svg" type="image/svg+xml" width="1720" height="1150"></object>
    </div>
</body>
</html>
